- name: Add grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add grafana repo
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main
    state: present
    filename: grafana

- name: Install alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: yes

- name: Template configuration
  template:
    src: config.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: root
    mode: "0644"
  notify: Restart alloy

- name: Enable alloy
  ansible.builtin.systemd:
    name: alloy
    enabled: yes
    state: started

- name: Setup PVE alloy
  ansible.builtin.command:
    cmd: pvesh create /cluster/metrics/server/local-alloy --type opentelemetry --server 127.0.0.1 --port 4318 --otel-protocol http --otel-path /v1/metrics --otel-compression gzip --otel-timeout 5
    creates: /etc/pve/status.cfg
